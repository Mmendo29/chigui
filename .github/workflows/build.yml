name: Compilar Chigüi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        run: |
          npx cap add android
          # Health Connect necesita Android 8.0 (API 26) o superior
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          # Número de versión que sube en cada compilación (para poder actualizar encima)
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Ícono de la app
        continue-on-error: true
        run: |
          npx --yes @capacitor/assets@4.0.0 generate --android --assetPath assets --iconBackgroundColor '#4CAA5E' --iconBackgroundColorDark '#4CAA5E' --splashBackgroundColor '#4CAA5E' --splashBackgroundColorDark '#4CAA5E'
          # Quitar el ícono adaptable de la plantilla (la "X" de Capacitor) para que Android use el del chigüiro
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Copiar la app web al proyecto
        run: npx cap sync android

      - name: Llave de firma fija (para que las actualizaciones se instalen encima)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  chigui {
                      storeFile rootProject.file("../keystore/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.chigui }
              }
          }
          GRADLE

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../chigui.apk
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $AS verify --print-certs ../chigui.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: chigui-apk
          path: chigui.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chigüi 1.0.${{ github.run_number }}
          body: "Descarga **chigui.apk** desde tu Android e instálalo."
          files: chigui.apk
          make_latest: true

  web:
    name: App web (iPhone)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
